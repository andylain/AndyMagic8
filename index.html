<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神奇八號球 Magic 8-Ball</title>
<meta name="theme-color" content="#0b0e18">
<!-- favicon 直接內嵌成 SVG data URI，維持零外部檔案 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='b' cx='35%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%235a5a5a'/%3E%3Cstop offset='55%25' stop-color='%231b1b1b'/%3E%3Cstop offset='100%25' stop-color='%23000'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15.5' fill='url(%23b)'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%23fff'/%3E%3Ctext x='16' y='20.6' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='%23111'%3E8%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="smoke" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="mode-menu">
    <button class="mode-btn" id="modeBtn" aria-haspopup="true" aria-expanded="false" aria-label="選擇模式">
      <span id="modeBtnIcon">🎱</span><span class="mode-btn-caret">▾</span>
    </button>
    <ul class="mode-list" id="modeList" role="menu" hidden></ul>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-pressed="false" aria-label="開啟音效" title="音效">🔇</button>

  <h1 id="pageTitle">🎱 神奇八號球</h1>

  <div class="ball" id="ball" role="button" tabindex="0" aria-label="搖動神奇八號球">
    <div class="window">
      <div class="tri-clip" aria-hidden="true"><div class="triangle"></div></div>
      <div class="answer" id="answer" data-mode="oracle" aria-live="polite">
        <span class="swatch" id="swatch" aria-hidden="true" hidden></span>
        <span class="primary">Ask a question</span>
        <span class="secondary">問個問題吧</span>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">心中默想問題，然後點一下球</p>

  <div class="list-menu">
    <button class="list-btn" id="listBtn" aria-haspopup="dialog" aria-expanded="false"
            aria-label="這個模式的總表" title="總表">📋</button>
    <div class="list-panel" id="listPanel" role="dialog" aria-label="總表" hidden></div>
  </div>

  <footer class="footer">
    Powered by <a href="https://andylain.com" target="_blank" rel="noopener">Andylain.com</a>
  </footer>

<script src="modes.js"></script>
<script src="app.js"></script>
</body>
</html>
