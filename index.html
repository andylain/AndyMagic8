<style>
  :root {
    --yes: #4ade80;
    --no: #f87171;
    --maybe: #fbbf24;
    /* 食物類別 */
    --snack:  #fbbf24;
    --noodle: #fb923c;
    --rice:   #a3e635;
    --intl:   #f472b6;
    --light:  #5eead4;
    /* 飲料／宵夜 */
    --tea:    #86efac;
    --coffee: #c8a165;
    --fizz:   #7dd3fc;
    --sweet:  #fda4af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: radial-gradient(circle at 50% 20%, #2b3556, #0b0e18 70%);
    color: #e8eaf2;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    padding: 24px;
    overflow-x: hidden;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0; letter-spacing: .05em; }

  /* 煙霧繚繞：幾團柔邊漸層緩慢飄移，不用任何圖檔 */
  .smoke {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* 拉長的橢圓霧帶，各自用不同角度與速度飄，交疊出繚繞感 */
  .smoke span {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }
  .smoke span:nth-child(1) {
    width: 90vmax; height: 38vmax; top: 2%; left: -25vmax;
    background: radial-gradient(closest-side, rgba(124,140,255,.20), rgba(124,140,255,.06) 55%, transparent 78%);
    animation: wisp-a 38s ease-in-out infinite alternate;
  }
  .smoke span:nth-child(2) {
    width: 75vmax; height: 30vmax; top: 34%; right: -22vmax;
    background: radial-gradient(closest-side, rgba(178,116,230,.19), rgba(178,116,230,.05) 55%, transparent 78%);
    animation: wisp-b 29s ease-in-out infinite alternate;
    animation-delay: -9s;
  }
  .smoke span:nth-child(3) {
    width: 82vmax; height: 34vmax; bottom: 4%; left: -20vmax;
    background: radial-gradient(closest-side, rgba(86,196,206,.15), rgba(86,196,206,.04) 55%, transparent 78%);
    animation: wisp-a 45s ease-in-out infinite alternate;
    animation-delay: -21s;
  }
  .smoke span:nth-child(4) {
    width: 62vmax; height: 26vmax; top: 60%; right: -14vmax;
    background: radial-gradient(closest-side, rgba(140,160,255,.16), rgba(140,160,255,.04) 55%, transparent 78%);
    animation: wisp-b 33s ease-in-out infinite alternate;
    animation-delay: -15s;
  }
  .smoke span:nth-child(5) {
    width: 70vmax; height: 24vmax; top: 16%; right: -18vmax;
    background: radial-gradient(closest-side, rgba(196,150,255,.13), rgba(196,150,255,.03) 55%, transparent 78%);
    animation: wisp-a 26s ease-in-out infinite alternate;
    animation-delay: -6s;
  }
  .smoke span:nth-child(6) {
    width: 58vmax; height: 22vmax; bottom: 26%; left: -10vmax;
    background: radial-gradient(closest-side, rgba(120,190,240,.12), rgba(120,190,240,.03) 55%, transparent 78%);
    animation: wisp-b 41s ease-in-out infinite alternate;
    animation-delay: -27s;
  }
  @keyframes wisp-a {
    from { transform: translate3d(-6%, 4%, 0) rotate(-12deg) scale(1); }
    to   { transform: translate3d(14%, -8%, 0) rotate(10deg) scale(1.3); }
  }
  @keyframes wisp-b {
    from { transform: translate3d(8%, -5%, 0) rotate(14deg) scale(1.2); }
    to   { transform: translate3d(-12%, 7%, 0) rotate(-8deg) scale(.9); }
  }

  /* 內容都疊在煙霧之上 */
  h1, .ball, .hint, .footer, .sound-toggle, .mode-menu { position: relative; z-index: 1; }

  .ball {
    width: min(78vw, 320px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #5a5a5a, #141414 55%, #000 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,.65), inset 0 -18px 40px rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .ball:active { transform: scale(.97); }
  .ball.shake { animation: shake .6s ease; }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-12px, 6px) rotate(-6deg); }
    40% { transform: translate(10px, -8px) rotate(5deg); }
    60% { transform: translate(-8px, -6px) rotate(-4deg); }
    80% { transform: translate(6px, 8px) rotate(3deg); }
  }

  /* 藍色三角視窗：三角形只當背景層，文字疊在上面才不會被 clip-path 切掉 */
  .window {
    position: relative;
    width: 60%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #0d1b3e;
    box-shadow: inset 0 0 30px rgba(0,0,0,.9);
    display: grid;
    place-items: center;
  }
  /* 圓形遮罩只裁三角形，文字在遮罩外層所以永遠不會被切到 */
  .tri-clip {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
  }
  .triangle {
    position: absolute;
    inset: 8% 4% 6%;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background: rgba(90, 130, 235, .02);
  }
  .answer {
    position: relative;   /* 疊在三角形之上 */
    z-index: 1;
    width: 84%;
    text-align: center;
    font-size: clamp(.66rem, 2.9vw, .9rem);
    line-height: 1.28;
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
    transition: opacity .25s;
  }
  .answer .primary { font-weight: 700; display: block; }
  .answer .secondary { display: block; font-size: .82em; opacity: .85; margin-top: 4px; }
  .answer.fade { opacity: 0; }
  /* 菜名短，放大才撐得起版面 */
  .answer[data-size="md"] .primary { font-size: 1.9em; letter-spacing: .06em; }
  .answer[data-size="lg"] .primary { font-size: 2.6em; letter-spacing: .08em; }
  .answer[data-size="xl"] .primary { font-size: 3.4em; line-height: 1; }
  .answer[data-size] .secondary { font-size: .78em; margin-top: 8px; }
  .answer[data-tone="yes"]    { color: var(--yes); }
  .answer[data-tone="no"]     { color: var(--no); }
  .answer[data-tone="maybe"]  { color: var(--maybe); }
  .answer[data-tone="snack"]  { color: var(--snack); }
  .answer[data-tone="noodle"] { color: var(--noodle); }
  .answer[data-tone="rice"]   { color: var(--rice); }
  .answer[data-tone="intl"]   { color: var(--intl); }
  .answer[data-tone="light"]  { color: var(--light); }
  .answer[data-tone="tea"]    { color: var(--tea); }
  .answer[data-tone="coffee"] { color: var(--coffee); }
  .answer[data-tone="fizz"]   { color: var(--fizz); }
  .answer[data-tone="sweet"]  { color: var(--sweet); }

  .hint {
    font-size: clamp(1rem, 3.8vw, 1.15rem);
    opacity: .72;
    margin: 0;
    letter-spacing: .04em;
  }

  .footer { font-size: .75rem; opacity: .45; margin-top: 8px; letter-spacing: .03em; }
  .footer a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
  .footer a:hover { opacity: .85; }

  .mode-menu { position: fixed; top: 16px; left: 16px; z-index: 3; }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 40px;
    padding: 0 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: inherit;
    font: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    opacity: .65;
    transition: opacity .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn:hover, .mode-btn[aria-expanded="true"] { opacity: 1; background: rgba(255,255,255,.12); }
  .mode-btn-caret { font-size: .7rem; opacity: .7; }
  .mode-list {
    position: absolute;
    top: 46px;
    left: 0;
    min-width: 168px;
    margin: 0;
    padding: 6px;
    list-style: none;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(18,22,38,.96);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }
  .mode-list[hidden] { display: none; }
  .mode-list button {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: none;
    color: inherit;
    font: inherit;
    font-size: .9rem;
    text-align: left;
    cursor: pointer;
  }
  .mode-list button:hover { background: rgba(255,255,255,.09); }
  .mode-list button[aria-current="true"] { background: rgba(255,255,255,.07); font-weight: 600; }
  .mode-list button[aria-current="true"]::after { content: "✓"; margin-left: auto; opacity: .7; }

  .sound-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    opacity: .55;
    transition: opacity .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-toggle:hover { opacity: 1; background: rgba(255,255,255,.12); }
  .sound-toggle[aria-pressed="true"] { opacity: .9; }

  /* 尊重系統的「減少動態效果」設定 */
  @media (prefers-reduced-motion: reduce) {
    .smoke span { animation: none; }
    .ball.shake { animation: none; }
  }
</style>
</head>

        { primary: "陽春麵",     secondary: "麵食", tone: "noodle" },
        { primary: "米粉湯",     secondary: "麵食", tone: "noodle" },
        { primary: "餛飩湯",     secondary: "麵食", tone: "noodle" },
        { primary: "炸雞",       secondary: "異國", tone: "intl" },
        { primary: "披薩",       secondary: "異國", tone: "intl" },
        { primary: "日式串燒",   secondary: "異國", tone: "intl" },
        { primary: "韓式炸雞",   secondary: "異國", tone: "intl" },
        { primary: "關東煮",     secondary: "清爽", tone: "light" },
        { primary: "瘦肉粥",     secondary: "清爽", tone: "light" },
        { primary: "茶葉蛋",     secondary: "清爽", tone: "light" },
        { primary: "水果",       secondary: "清爽", tone: "light" },
        { primary: "豆花",       secondary: "甜食", tone: "sweet" },
        { primary: "雞蛋糕",     secondary: "甜食", tone: "sweet" },
        { primary: "紅豆湯",     secondary: "甜食", tone: "sweet" }
      ]
    }
  ];

  /* ---------- 音效：Web Audio 即時合成，不載入任何音檔 ---------- */

  const SOUND_KEY = "magic8-sound";
  let soundOn = false;
  try { soundOn = localStorage.getItem(SOUND_KEY) === "on"; } catch (e) {}

  let audioCtx = null;
  function getCtx() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    // iOS/Chrome 的自動播放政策：必須在使用者手勢裡 resume
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function noiseBuffer(ctx, seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function playShake() {
    if (!soundOn) return;
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;

    // 液體晃動：白噪音穿過頻率掃動的帶通濾波器
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 0.7);

    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(700, t);
    bp.frequency.exponentialRampToValueAtTime(2400, t + 0.25);
    bp.frequency.exponentialRampToValueAtTime(900, t + 0.55);

    // 三下起伏，對齊 @keyframes shake 的節奏
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    [0, 0.18, 0.36].forEach((d, i) => {
      g.gain.linearRampToValueAtTime(0.22 - i * 0.05, t + d + 0.06);
      g.gain.linearRampToValueAtTime(0.015, t + d + 0.16);
    });
    g.gain.linearRampToValueAtTime(0.0001, t + 0.62);

    src.connect(bp).connect(g).connect(ctx.destination);
    src.start(t);
    src.stop(t + 0.7);

    // 答案浮現時的「咚」
    const osc = ctx.createOscillator();
    const og = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, t + 0.55);
    osc.frequency.exponentialRampToValueAtTime(62, t + 0.82);
    og.gain.setValueAtTime(0.0001, t + 0.55);
    og.gain.linearRampToValueAtTime(0.16, t + 0.60);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.92);
    osc.connect(og).connect(ctx.destination);
    osc.start(t + 0.55);
    osc.stop(t + 0.95);
  }

  const soundBtn = document.getElementById("soundToggle");
  function renderSoundBtn() {
    soundBtn.textContent = soundOn ? "\u{1F50A}" : "\u{1F507}";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "關閉音效" : "開啟音效");
  }
  renderSoundBtn();

  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
    renderSoundBtn();
    if (soundOn) getCtx();   // 趁這個手勢把 AudioContext 解鎖
  });

  /* ---------- 模式 ---------- */

  const answer    = document.getElementById("answer");
  const pageTitle = document.getElementById("pageTitle");
  const hintEl    = document.getElementById("hint");
  const modeBtn   = document.getElementById("modeBtn");
  const modeIcon  = document.getElementById("modeBtnIcon");
  const modeList  = document.getElementById("modeList");

  // 預設永遠是神奇八號球：每次打開都從這裡開始，不記上次選了什麼
  let mode = MODES[0];

  let lastItem = null;   // 只有 noRepeat 的模式會用到

  function showItem(item) {
    answer.dataset.tone = item.tone || "";
    answer.querySelector(".primary").textContent = item.primary;
    answer.querySelector(".secondary").textContent = item.secondary;
  }

  function pick() {
    const items = mode.items;
    let item = items[Math.floor(Math.random() * items.length)];
    // 只在題庫夠大時才避免連抽重複，否則會把「隨機」變成「輪流」
    if (mode.noRepeat && items.length > 2) {
      while (item === lastItem) item = items[Math.floor(Math.random() * items.length)];
    }
    lastItem = item;
    return item;
  }

  function applyMode(next) {
    mode = next;
    lastItem = null;
    answer.dataset.mode = mode.id;
    if (mode.size) answer.dataset.size = mode.size; else delete answer.dataset.size;
    pageTitle.textContent = mode.icon + " " + mode.label;
    document.title = mode.label + " Magic 8-Ball";
    hintEl.textContent = mode.hint;
    modeIcon.textContent = mode.icon;
    ball.setAttribute("aria-label", "搖動" + mode.label);
    showItem(mode.initial);
    [...modeList.querySelectorAll("button")].forEach(b =>
      b.setAttribute("aria-current", String(b.dataset.id === mode.id)));
  }

  MODES.forEach(m => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "menuitem");
    btn.dataset.id = m.id;
    btn.textContent = m.icon + "\u00A0\u00A0" + m.label;
    btn.addEventListener("click", () => { applyMode(m); closeMenu(); modeBtn.focus(); });
    li.appendChild(btn);
    modeList.appendChild(li);
  });

  function openMenu() {
    modeList.hidden = false;
    modeBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    modeList.hidden = true;
    modeBtn.setAttribute("aria-expanded", "false");
  }
  modeBtn.addEventListener("click", e => {
    e.stopPropagation();
    modeList.hidden ? openMenu() : closeMenu();
  });
  document.addEventListener("click", e => {
    if (!modeList.hidden && !e.target.closest(".mode-menu")) closeMenu();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !modeList.hidden) { closeMenu(); modeBtn.focus(); }
  });

  /* ---------- 搖球 ---------- */

  const ball = document.getElementById("ball");
  let rolling = false;

  function shake() {
    if (rolling) return;
    rolling = true;

    ball.classList.remove("shake");
    void ball.offsetWidth;      // 重播動畫
    ball.classList.add("shake");
    answer.classList.add("fade");
    playShake();

    setTimeout(() => {
      showItem(pick());
      answer.classList.remove("fade");
      rolling = false;
    }, 600);
  }

  ball.addEventListener("click", shake);
  ball.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); shake(); }
  });

  applyMode(mode);
</script>
</body>
</html>
